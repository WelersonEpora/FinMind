services:
  backend:
    image: ghcr.io/${GHCR_OWNER:-welersonepora}/finmind-backend:${BACKEND_IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
    expose:
      - "${APP_PORT:-3000}"
    volumes:
      - photo_storage:/app/storage/photos
    # "db": rede do PostgreSQL compartilhado da VM (repositório servidor02-infra, ADR 0026); o .env aponta
    # POSTGRES_HOST=postgres. O banco não faz parte deste compose.
    networks:
      - default
      - db

  frontend:
    image: ghcr.io/${GHCR_OWNER:-welersonepora}/finmind-frontend:${FRONTEND_IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8083}:80"
    depends_on:
      - backend

volumes:
  photo_storage:

networks:
  db:
    external: true
