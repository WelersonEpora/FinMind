services:
  mariadb:
    image: mariadb:11
    container_name: finmind-mariadb
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${MARIADB_DATABASE:-finmind}
      MARIADB_USER: ${MARIADB_USER:-finmind}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:-finmind}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-finmind_root}
    ports:
      - "${MARIADB_PORT:-3306}:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

  phpmyadmin:
    image: phpmyadmin:5
    container_name: finmind-phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: mariadb
    ports:
      - "${PHPMYADMIN_PORT:-8080}:80"
    depends_on:
      mariadb:
        condition: service_healthy

volumes:
  mariadb_data:
