services:
  mariadb:
    image: mariadb:11
    container_name: finmind-mariadb
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${MARIADB_DATABASE:-finmind}
      MARIADB_USER: ${MARIADB_USER:-finmind}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:-finmind}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-finmind_root}
    ports:
      - "${MARIADB_PORT:-3306}:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

  # PostgreSQL (ADR 0026): convive com o MariaDB até a virada. O backend usa um ou outro por DB_DIALECT.
  postgres:
    image: postgres:16-alpine
    container_name: finmind-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DATABASE:-finmind}
      POSTGRES_USER: ${POSTGRES_USER:-finmind}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-finmind}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  phpmyadmin:
    image: phpmyadmin:5
    container_name: finmind-phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: mariadb
    ports:
      - "${PHPMYADMIN_PORT:-8080}:80"
    depends_on:
      mariadb:
        condition: service_healthy

volumes:
  mariadb_data:
  postgres_data:
