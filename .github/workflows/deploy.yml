name: Build and Deploy

on:
  push:
    branches:
      - main

concurrency:
  group: finmind-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get commit metadata
        id: commit_meta
        run: |
          echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "commit_date=$(git show -s --format=%cI HEAD)" >> "$GITHUB_OUTPUT"

      # O contexto de build do backend é ./backend, que não enxerga a raiz do
      # repositório; a tela "Status do projeto" lê este arquivo (ver
      # backend/src/services/status-projeto.service.js).
      - name: Include STATUS_DO_PROJETO.md in the backend image
        run: cp STATUS_DO_PROJETO.md backend/STATUS_DO_PROJETO.md

      # Imagens multi-arquitetura: amd64 (VM atual, x86) e arm64 (VM Ampere A1).
      # O QEMU emula o arm64 no runner x86.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata (backend)
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/finmind-backend
          tags: |
            type=raw,value=latest
            type=sha

      - name: Build and push (backend)
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          build-args: |
            GIT_COMMIT=${{ steps.commit_meta.outputs.sha_short }}
            GIT_COMMIT_DATE=${{ steps.commit_meta.outputs.commit_date }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract Docker metadata (frontend)
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/finmind-frontend
          tags: |
            type=raw,value=latest
            type=sha

      - name: Build and push (frontend)
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy on Oracle VM
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ${{ secrets.ORACLE_USER }}
          key: ${{ secrets.ORACLE_SSH_KEY }}
          script_stop: false
          command_timeout: 30m
          script: |
            echo "${{ secrets.GHCR_PAT }}" | sudo -iu deploy bash -lc 'cd /opt/apps/finmind/app && git pull --ff-only && chmod +x scripts/deploy.sh && bash scripts/github-deploy.sh "${{ secrets.GHCR_USERNAME }}"'
