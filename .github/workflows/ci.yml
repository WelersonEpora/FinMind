name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    # Só para o teste de isolamento das tabelas privadas (ADR 0007, §6; ADR 0127): o `npm test` continua sem banco.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: finmind
          POSTGRES_PASSWORD: finmind
          POSTGRES_DB: finmind_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U finmind -d finmind_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_DATABASE: finmind_test
      POSTGRES_USER: finmind
      POSTGRES_PASSWORD: finmind
      JWT_SECRET: ci-test-secret

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Migrate (Postgres do CI)
        run: npm run db:migrate

      - name: Test de isolamento entre espaços (Postgres real)
        run: node --test src/repositories/carteira.integration.test.js
        env:
          FINMIND_TEST_DB: "1"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
