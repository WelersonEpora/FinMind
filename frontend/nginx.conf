server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # DNS embutido do Docker - resolução do backend acontece a cada
    # requisição, não só na inicialização (mesmo motivo do AgroMind: evita
    # que o nginx recuse subir se o backend ainda não estiver pronto).
    resolver 127.0.0.11 valid=10s;

    # Vue Router em History Mode: qualquer rota que não seja um arquivo
    # estático real cai no index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Mesma origem do frontend, sem CORS - necessário também porque a
    # autenticação depende de cookie de mesma origem.
    location /api/ {
        set $backend_upstream http://backend:3000;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        set $backend_upstream http://backend:3000;
        proxy_pass $backend_upstream;
    }
}
