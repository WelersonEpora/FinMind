server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Default do Nginx é 1MB - baixo demais pra upload de foto de avatar
    # (POST /api/v1/users/*/photo, limite de 5MB no multer - ver
    # backend/src/routes/user.routes.js). Sem isso, qualquer foto real
    # (a maioria vem de celular, alguns MB) é recusada aqui, antes de
    # chegar no backend - por isso "não foi possível enviar a foto"
    # acontecia mesmo com JPEG/PNG/WebP válidos.
    client_max_body_size 6m;

    # DNS embutido do Docker - resolução do backend acontece a cada
    # requisição, não só na inicialização (mesmo motivo do AgroMind: evita
    # que o nginx recuse subir se o backend ainda não estiver pronto).
    resolver 127.0.0.11 valid=10s;

    # Vue Router em History Mode: qualquer rota que não seja um arquivo
    # estático real cai no index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # O index.html aponta para os arquivos com hash do build e NUNCA pode vir do cache do
    # navegador sem revalidar: sem isso, depois de um deploy o navegador pode abrir o index.html
    # antigo por horas e mostrar a versão velha da tela (achado real, 2026-09-21: só o refresh
    # forçado trazia a tela nova). `no-cache` = revalida a cada abertura (304 se não mudou).
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Arquivos com hash no nome (js, css) nunca mudam de conteúdo: cache longo, sem revalidar.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Mesma origem do frontend, sem CORS - necessário também porque a
    # autenticação depende de cookie de mesma origem.
    location /api/ {
        set $backend_upstream http://backend:3000;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        set $backend_upstream http://backend:3000;
        proxy_pass $backend_upstream;
    }
}
